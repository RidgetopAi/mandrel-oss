server {
    listen 3000;
    server_name localhost;

    # Enable compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Root location with cache headers
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff";
        }

        # No cache for HTML files
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # API proxy to the command backend service.
    # NOTE: use Docker's embedded DNS (127.0.0.11) + a variable upstream so nginx
    # RE-RESOLVES the backend's container IP per request instead of caching it once
    # at config load. Without this, a backend container restart (new IP) makes this
    # frontend 502 until the frontend itself is restarted (the 2026-06-27 stale-
    # upstream incident).
    location /api {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend mandrel-command-backend;
        proxy_pass http://$upstream_backend:5000;
        # Must admit the largest task attachment: the app limit is MAX_ATTACHMENT_BYTES (5 MiB)
        # in mandrel-command/backend/src/config/taskAttachments.ts. nginx's 1m default would
        # 413 every real attachment before the app's own 413 handling runs. 6m = 5 MiB + headroom
        # for multipart framing/fields.
        client_max_body_size 6m;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
}
