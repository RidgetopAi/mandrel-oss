# =============================================================================
# guard-classes.conf — THE GUARD-CLASS REGISTRY. Data, not code.
# =============================================================================
# Read by scripts/lib/guard-class-registry.sh, which is the ONE parser. the CI gate
# STAGE 0a22d checks this table against the tree on every gate run, and the
# Mandrel `class:` tag axis (mcp-server/src/config/threadingVocabConfig.ts,
# GUARD_CLASS_VALUES) accepts exactly the ids listed here — a task cannot claim
# a class this file does not know.
#
# WHY THIS FILE EXISTS (measured 2026-09-01 on a production database)
#   Between 2026-08-27 and 2026-09-01, 32 tasks were filed under ONE tag value,
#   `class:guards-need-guarding`, joined to each other only by prose pointers
#   ("same class as that earlier one", "one directory over"). Nothing mapped a class to the
#   stage that detects it, so batches 8 through 11 each rediscovered the same
#   sub-classes by reading, and every batch of ~10 lanes filed 5-8 new siblings.
#   A class was "closed" whenever its latest sweep task said so. This table makes a
#   class an OBJECT: it has an id, it has a detector or it has named debt, and the
#   number of classes with no detector is a pinned ratchet that cannot grow silently.
#
# HOW A SWEEP USES IT
#   Found a sibling? Look here first. If its class has a detector, the detector is
#   what should have caught it — fix the DETECTOR (or its population), do not file
#   an instance. If its class is here with detector `-`, the open task in field 3 is
#   where the work goes. If its class is not here, the task IS adding the row, and
#   the row must either carry a detector or raise `!undetected-max` in the same
#   commit — that diff is the decision, visible in review.
#
# FORMAT — four ~-separated fields, one class per line. Blank lines and lines
# beginning with # are ignored. No field may contain a ~.
#
#   1 id          stable class identifier: [a-z0-9]+(-[a-z0-9]+)* , max 40 chars —
#                 the same shape as a `batch:` label, because it is also the value
#                 of the `class:` tag on a Mandrel task.
#   2 detectors   comma-separated, or `-` for none. Each is one of:
#                   stage:<id>   a LIVE `gate_stage_enabled <id>` declaration in
#                                the CI gate (checked through gate_stages_parse,
#                                so a commented-out stage does not count)
#                   test:<path>  a file that exists at that repo-relative path (a
#                                vitest contract test, a probe script)
#                   ext:<repo>:<path>  a detector in ANOTHER repo. Accepted and
#                                printed as UNVERIFIED — this gate cannot see that
#                                tree. It is a declaration, not a proof.
#                 A row whose detectors are all `-`/absent is UNDETECTED debt: it
#                 must carry ≥1 record, and the total of such rows may not exceed
#                 the `!undetected-max` directive below.
#   3 records     comma-separated task ids, or `-`. The instances
#                 this class has spawned; the evidence a reader chases.
#   4 description one line: the tell, in the words a reader would grep for.
#
# CO-LOCATION. Every detector named by `stage:` or `test:` must carry a
#   `# GUARDS-CLASS: <id>` (or `// GUARDS-CLASS: <id>`) marker in the file that
#   implements it, and every such marker anywhere under scripts/ or mcp-server/src
#   must name an id in this table. Both directions are checked, so a class cannot
#   be encoded without being registered, and cannot be registered as encoded
#   without the code saying so.
#
# THE RATCHET. `!undetected-max N` is the ceiling on rows with no detector. It
#   starts at the measured number and is meant to go DOWN. Raising it is a
#   two-line diff (this line + the new row) and therefore a decision, not drift.
# Raised 3 -> 7: four classes lost their only detector when the hosted-fleet
# stages and suites were deleted (generator-omits-fleet-posture, verdict-from-uncontracted-status,
# fleet-drift-env-seam, sweep-removes-without-detaching). The classes stay registered (they are
# values of the served `class:` lens axis); they are honestly UNDETECTED debt now.
!undetected-max 7
# ...and the same ratchet for `ext:` rows, whose detectors this gate CANNOT execute.
# Added 2026-09-02: before it, an `ext:` row satisfied the
# has-a-detector test outright, so a class could be marked "encoded" forever by a
# path in another repo that nothing here ever opens — invisible to !undetected-max
# and to any reader who did not go looking. Counted, capped, and printed on every run.
!ext-unverified-max 1

# ---- encoded in the CI gate stages ---------------------------------------
# READ THE SCOPE OF 0a8f BEFORE TRUSTING THIS ROW (measured 2026-09-02).
# stage:0a8f is the differential's own MUTATION PROBE, not a sweep of the suites: the
# population scanner is scripts/host-shape-differential.sh, which nothing schedules
# (~45 min), and whose flipped shape is exactly HSD_STUB_BINARIES +
# HSD_STUB_MARKER_VARS — today `docker` and a marker dir. An earlier defect was this class and
# neither arm could have caught it: its shape variable was "a live */2 cron writer
# appends a host path during the run", which is not a binary and not a marker dir, and
# 0a8f additionally SKIPS on the fleet host by design (it needs docker ABSENT to flip).
# Widening the differential with a host-path/live-writer dimension is the open work.
host-shape-in-suite~stage:0a8f~-~a suite encodes the shape of the host it was written on (the control host uutils vs the production host GNU); green on one plane, meaningless on the other
fixture-vacuity~stage:0a8g~-~a fixture that must clear a product resolver aborts upstream of its assertions, and the suite reports green having measured nothing
fixture-reaches-real-binary~stage:0a31~-~a test fixture reaches a real binary or loads its subject partially, so the suite exercises the host instead of the fixture
generator-omits-fleet-posture~-~-~a generator writes an instance config without a fleet posture key, so every instance it produces resolves that key from the permissive CODE DEFAULT and is born pre-drifted; remediating the instances leaves the generator intact
two-channel-answer-read-through-one~stage:0a11f~-~an answer that travels on two channels — a CARRIER saying the call ran and a PAYLOAD saying what happened — is read through only one, so a claim is minted from evidence that cannot support it; it recurs on alternating channels, and supplying a correct reader is insufficient because the primitive's natural output is the wrong channel
verdict-from-uncontracted-status~-~-~a check compares a status code with == so any status it has no contract for renders as a verdict about the system, turning could-not-measure into a confident accusation
unwired-suite~stage:0a22~-~an executable assertion that nothing invokes; it ran once, by hand, on the day it was written
pipefail-boolean~stage:0a22c~-~producer | grep -q P under pipefail inverts the verdict when the producer dies of SIGPIPE
shared-namespace-enumeration~stage:0a22b~-~a test enumerates a namespace it does not own, so a neighbour's addition breaks or hides it
served-openapi-drift~stage:5p~-~the spec the running image SERVES drifts from the spec in the tree
gate-reads-control-tree~stage:0a7~-~the gate reads the CONTROL tree's HEAD instead of the ref actually being shipped
guard-not-fail-closed~stage:0a29,test:scripts/test/mutation-probe.test.sh~-~a guard's verdict is not fail-closed: exit 0 on its own error, alert-only, or a config it reads asymmetrically
lint-population-one-dir-over~stage:4b~-~typecheck or lint runs over a population one directory narrower than the code that ships
fleet-drift-env-seam~-~-~a fleet-drift test reaches its subject through an env seam the product itself never uses
gate-ci-population-disjoint~stage:0a22e~-~the local gate and CI scan different populations, so green here is never green there (CLASSES.md C4)
ledger-trusted-over-object~stage:0c2~-~a ledger of applied migrations is read as proof of the schema, so a missing column or an unalterable table owner is invisible while the count reads 83/83
secret-on-child-argv~stage:0a20d~-~a secret is handed to a child process on its ARGV (docker -e K=V, node -e … "$pw", psql -c, curl -d, sed -e) and is world-readable in /proc for the child's lifetime; each fix moves it off ONE child while the next child in the same pipeline still carries it, because the population of children was never enumerated
stale-file-bind-mount~stage:0a32,test:scripts/test/bind-file-mount-ban.test.sh~-~a bind mount whose source is a regular file pins the INODE, so a git update to the host tree never reaches the container and every instrument in the deploy chain still reports success
unpinned-instrument-verdict~stage:IN~-~a stage's verdict is produced by an external binary whose version the gate never established, so two boxes answer differently on the same ref and the LOCAL green is the weaker measurement with nothing saying so

# ---- encoded as mcp-server contract tests -----------------------------------
paged-order-no-tiebreaker~test:mcp-server/src/tests/searchOrderTotal.contract.test.ts~-~ordered-and-paged output with no total-order tiebreaker, so pages overlap or skip rows
unguarded-pg-pool~test:mcp-server/src/tests/unguardedPoolOutsideSrc.contract.test.ts~-~a pg Pool constructed outside the guarded factory, with none of its limits
serializer-literal-recurs~test:mcp-server/src/tests/taskFieldsReadable.contract.test.ts~-~a field-list literal recurs across serializers, so a field writable on one surface is unreadable on another
backwards-belief-edge~test:mcp-server/src/tests/migration096MintedEdgeFk.contract.test.ts~-~a belief edge minted with its endpoints reversed, which no FK notices
renderer-drops-structured-fact~test:mcp-server/src/tests/gateExitCodeRendered.contract.test.ts~-~a structured fact stored on the record (metadata.gate, the review verdict) is never read by the line renderer, so a three-state contract renders as two and a reader cannot tell RED from CANNOT-MEASURE

# ---- encoded in runtime (declared, UNVERIFIED from this repo) -------------
# `ext:` rows are taken at their word: this gate cannot execute them, so they are
# printed UNVERIFIED and counted against !ext-unverified-max. A declared detector
# nothing here can run is a PROMISE, not a guard, and the ceiling is what stops the
# registry filling up with promises. gate-ci-population-disjoint used to sit here
# pointing at ext:runtime:runtime/lib/scan-population.ts; on 2026-09-02 it was
# given a real in-repo detector (STAGE 0a22e) and moved up, which is what took this
# ceiling from 2 to 1.
reaper-never-reaped~ext:runtime:runtime/control-plane/reaper.coverage.test.ts~-~a reaper whose scope config excluded everything it was meant to reap

# ---- UNDETECTED — named debt, counted by the ratchet above -------------------
guard-reads-unexecuted-copy~-~-~a guard reads a checkout nobody executes (the control host tree) instead of the one that ships (the production host)
regex-recognizer-unowned-parser~-~-~a regex recognizer stands in for a parser nobody owns; what it cannot parse, it passes
secret-reading-command~-~-~a command prints a secret-bearing config unfiltered into a transcript (2026-09-01 belief-key leak)

sweep-removes-without-detaching~-~-~a cleanup sweep removes a resource without releasing what still holds it, swallows the daemon's refusal, and asserts nothing afterwards, so every run leaks one more of a finite pooled resource
