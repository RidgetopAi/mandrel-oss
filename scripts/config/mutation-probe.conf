# =============================================================================
# mutation-probe.conf — tunables for scripts/mutation-probe.sh
#
# Sourced by the harness. Values here are the ones that depend on a THIRD PARTY's
# output format (a test runner's summary lines), which is exactly the kind of thing
# that must not be buried in the middle of a script.
#
# NOTE ON STRENGTH — read this before you rely on anything in this file.
# The harness has three independent defences against scoring a mutant that never
# executed. They are NOT equally strong, and they are listed here worst-to-best so
# nobody mistakes the weak one for the guarantee:
#
#   3rd (weakest) — MUTATION_PROBE_NO_TESTS_PATTERNS below. This is PROSE MATCHING.
#                   It reads a runner's human summary line. If the runner changes its
#                   wording, this defence fails OPEN and silently. It is a backstop,
#                   never the reason a verdict is trustworthy.
#   2nd           — the column-0 witness rule (in the harness, not configurable). A
#                   runner that prints a syntax-error SOURCE LISTING reproduces the
#                   mutated line — including the witness string inside it — but always
#                   indented behind a gutter. Requiring column 0 rejects that.
#   1st (best)    — --witness-file. The witness must appear in a FILE that only the
#                   mutated code can write. No amount of reporter output can forge it,
#                   and a mutant that fails to compile cannot produce it at all. This
#                   is the only defence that is structural rather than textual.
#
# Use --witness-file whenever the command is a test runner.
# =============================================================================

# Fixed substrings that mean "the runner completed but executed ZERO tests".
# An exit code cannot distinguish that from a real detection: both are non-zero. A
# run that executed no tests measured nothing, so it is a HARNESS ERROR (exit 2) and
# never a verdict in either direction.
#
# Measured 2026-09-04 on vitest 2.1.9 in mcp-server: a mutant with a syntax error
# exits 1 and prints `      Tests  no tests` while `Test Files  1 failed (1)`. Read
# as a verdict that is "the guard caught it" — from code that never ran a line.
#
# Over-matching here is the SAFE direction: a guard whose own RED message happens to
# contain one of these strings gets a refusal to judge, not a false green.
MUTATION_PROBE_NO_TESTS_PATTERNS=(
  'Tests  no tests'      # vitest — its summary column, two spaces, measured above
  'No test files found'  # vitest/jest — nothing matched the include pattern
  'No tests found'       # jest
)

# Fixed substrings that identify the command as a TEST RUNNER, used only to add a
# targeted HINT when a stream witness was not observed (see WITNESS CHANNELS in the
# harness header). This is deliberately NOT a gate: it is matched against the
# command's OUTPUT, a wrapper script can hide the runner, and a recognizer that
# REFUSES work on a leaky pattern gets deleted the first time it is inconvenient.
# It changes no verdict — it only makes the failure message say the useful thing.
MUTATION_PROBE_TEST_RUNNER_FINGERPRINTS=(
  'Test Files'
  'RUN  v'
  'Tests:'
  'PASS '
  'FAIL '
)
