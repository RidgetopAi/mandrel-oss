# =============================================================================
# docker-compose.build.yml — RELEASE BUILD overlay.
# =============================================================================
# Layer it on docker-compose.yml to build the three CODE services as a release:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build \
#     mcp-server mandrel-command-backend mandrel-command-frontend
# run ONCE per release ref. It makes the revision required, tags the three images
# mandrel/<svc>:${MANDREL_IMAGE_TAG}, and labels each with
# org.opencontainers.image.revision=<full sha> (MANDREL_IMAGE_REVISION), which is how
# "which ref is this container running" is answered without a registry:
#   docker inspect <c> --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
#
# Example: export MANDREL_IMAGE_TAG=dev MANDREL_IMAGE_REVISION=$(git rev-parse HEAD)
# and run the build above; then plain `docker compose up -d` uses those images.
#
# This is not a per-instance compose file: it is one instance-agnostic overlay.

services:
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
      # ONE variable, TWO consumers: the same MANDREL_IMAGE_REVISION
      # becomes the image LABEL below and the process's ENV (mcp-server/Dockerfile
      # ARG->ENV), from which src/version.ts derives the reported `<semver>+<sha12>`.
      # Because both interpolate the same `${MANDREL_IMAGE_REVISION:?...}`, the label
      # and the version a client sees are physically incapable of disagreeing — there
      # is no second path to "what ref is this".
      args:
        MANDREL_IMAGE_REVISION: "${MANDREL_IMAGE_REVISION:?MANDREL_IMAGE_REVISION is required at build time — the full git sha of the release ref (the release build sets it)}"
      labels:
        org.opencontainers.image.revision: "${MANDREL_IMAGE_REVISION:?MANDREL_IMAGE_REVISION is required at build time — the full git sha of the release ref (the release build sets it)}"

  mandrel-command-backend:
    build:
      # Build from the mandrel-command npm-workspace ROOT so the workspace-root
      # package-lock.json is the single source of truth (no per-member lockfile).
      # The Dockerfile installs workspace-scoped (npm ci -w) to avoid frontend bloat.
      context: ./mandrel-command
      dockerfile: backend/Dockerfile
      labels:
        org.opencontainers.image.revision: "${MANDREL_IMAGE_REVISION:?MANDREL_IMAGE_REVISION is required at build time — the full git sha of the release ref (the release build sets it)}"

  mandrel-command-frontend:
    build:
      # Build from the mandrel-command npm-workspace ROOT (single-source-of-truth
      # lockfile). Workspace-scoped install (npm ci -w) keeps backend deps out.
      context: ./mandrel-command
      dockerfile: frontend/Dockerfile
      # Build-time UI wording (pages/punch/config.ts). Unset = the frontend's default.
      args:
        VITE_PUNCH_RISK_GATE_LABEL: "${MANDREL_PUNCH_RISK_GATE_LABEL:-}"
      labels:
        org.opencontainers.image.revision: "${MANDREL_IMAGE_REVISION:?MANDREL_IMAGE_REVISION is required at build time — the full git sha of the release ref (the release build sets it)}"
