# Mandrel Docker Compose Configuration — ONE file for a single instance and for several
# instances side by side on one host.
#
# Install (the supported path): ./install.sh — it writes .env and runs this file.
# By hand:                       docker compose up -d
# A second instance on the same host: give it its own env file and project name, e.g.
#                                docker compose --env-file ./instance-b.env -p mandrel-b up -d
#
# TENANT_* interpolation contract (values live in the instance's env file):
#   TENANT_HANDLE            e.g. team-a       → container names mandrel-<h>-…,
#                            Traefik router names, network label.
#                            UNSET (single instance) → container names fall back to the
#                            classic mandrel-postgres/… via ${VAR:+…} (see below).
#   TENANT_DOMAIN            e.g. team-a.mandrel.example.com → Traefik Host() rules.
#   TENANT_PG_PORT / TENANT_REDIS_PORT / TENANT_MCP_PORT /
#   TENANT_BACKEND_PORT / TENANT_FRONTEND_PORT
#                            host ports (defaults = the classic 5432/6379/8080/
#                            5000/3000). All host ports bind 127.0.0.1 ONLY.
#   TENANT_OAUTH_ROUTER_HOST set to the instance's domain ONLY for an OAuth-enabled
#                            instance (see the OAuth router labels below). Unset → the
#                            router matches an unmatchable host and is INERT.
# The Traefik labels are inert unless you run Traefik on the host and join it to the
# instance network; a single instance behind your own reverse proxy can ignore them.
# Container names (mandrel-<h>-postgres, …) are an interface: tooling outside this file
# matches them. Do not restructure them.
#
# MANDREL_IMAGE_TAG (default `local`): the image tag the three code services run — see the
# mcp-server service note. Each code service carries a `build:` stanza, so a fresh clone
# builds its images locally; docker-compose.build.yml adds the release build arguments.
#
# Values come from your SHELL before the env file: Compose resolves ${VAR} from the
# environment of the shell that runs it BEFORE --env-file, so a variable exported there
# (ANTHROPIC_API_KEY, say) wins over the instance's env file. Run each instance from a
# shell that does not export another instance's values.

# Health check configuration template
x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

# Log rotation, per service. Without a `logging:` stanza Docker's json-file driver is
# unbounded. mcp-server keeps 100m x 5; every other service 50m x 3. Set here rather than
# in /etc/docker/daemon.json because daemon defaults apply only when a container is created.
x-logging-mcp: &logging-mcp
  driver: json-file
  options:
    max-size: 100m
    max-file: "5"
x-logging-svc: &logging-svc
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  # PostgreSQL with pgvector extension (required for Mandrel)
  postgres:
    # Pinned for a fresh install. An existing instance whose data volume was initialised with
    # another pgvector image sets PGVECTOR_IMAGE in its env file: changing the image here
    # would recreate its postgres container.
    image: ${PGVECTOR_IMAGE:-ankane/pgvector:v0.5.1}
    # "mandrel-<h>-postgres" when TENANT_HANDLE is set, "mandrel-postgres" when it is not.
    container_name: "mandrel-${TENANT_HANDLE:+${TENANT_HANDLE}-}postgres"
    # Memory cap; override per instance in the env file.
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    restart: unless-stopped
    logging: *logging-svc
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mandrel}
      POSTGRES_USER: ${POSTGRES_USER:-mandrel}
      # No weak shared default: set a strong unique POSTGRES_PASSWORD in the instance's env
      # file (install.sh generates one). Compose refuses to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set a strong unique value in the instance env file}
    ports:
      - "127.0.0.1:${TENANT_PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provisions the required extensions on the first init of a fresh data volume.
      # BIND-FILE-MOUNT-OK: /docker-entrypoint-initdb.d is read ONLY during the first init of a
      # fresh data volume, which only happens in a just-created container, and a just-created
      # container resolves its mounts fresh. A long-lived container's pinned inode is never the
      # one that runs. A directory mount is not an option: the whole init dir is not what we
      # want to hand postgres.
      - ./mcp-server/database/init/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
      # Tightens pg_hba loopback-TCP trust to scram on first init (runs after 00-extensions).
      # BIND-FILE-MOUNT-OK: same reason as 00-extensions.sql above: initdb-only, so the pinned
      # inode has no reader in a long-lived container.
      - ./mcp-server/database/init/01-harden-pg-hba.sh:/docker-entrypoint-initdb.d/01-harden-pg-hba.sh:ro
    networks:
      - mandrel-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mandrel}"]

  # Redis for BullMQ queue system
  redis:
    image: redis:7-alpine
    container_name: "mandrel-${TENANT_HANDLE:+${TENANT_HANDLE}-}redis"
    # Memory cap: maxmemory 256mb plus AOF/fork headroom; override per instance in the env file.
    mem_limit: ${REDIS_MEM_LIMIT:-320m}
    restart: unless-stopped
    logging: *logging-svc
    ports:
      - "127.0.0.1:${TENANT_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - mandrel-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  # MCP Server - Core Mandrel context management service
  #
  # The three CODE services run a NAMED, TAGGED image, mandrel/<svc>:${MANDREL_IMAGE_TAG}.
  # Each also carries a `build:` stanza, so `cp .env.example .env && docker compose up -d
  # --build` works from a fresh clone. A release build layers docker-compose.build.yml on
  # top (`-f docker-compose.yml -f docker-compose.build.yml build`), which makes the
  # revision arg required and adds the revision label. A deployment that rolls prebuilt
  # images should `up --no-build`, so every instance runs the one image it was given.
  #
  # MANDREL_IMAGE_TAG defaults to `local`: a fresh clone builds and runs its own images
  # under that tag. A deployment that rolls prebuilt release images sets it explicitly.
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
      # The git revision the image was built from; install.sh exports it from the checkout so
      # /health reads <semver>+<sha12>. Empty (no git checkout) reads <semver>+unknown.
      args:
        MANDREL_IMAGE_REVISION: "${MANDREL_IMAGE_REVISION:-}"
    image: "mandrel/mcp-server:${MANDREL_IMAGE_TAG:-local}"
    container_name: "mandrel-${TENANT_HANDLE:+${TENANT_HANDLE}-}mcp-server"
    # Memory cap; Node's heap is capped below it via NODE_OPTIONS. Override per instance in the env file.
    mem_limit: ${MCP_MEM_LIMIT:-768m}
    restart: unless-stopped
    logging: *logging-mcp
    ports:
      - "127.0.0.1:${TENANT_MCP_PORT:-8080}:8080"
    # Gives the container a name for the HOST, for an embedder served by the host's Ollama
    # daemon (MANDREL_OLLAMA_ENDPOINT=http://host.docker.internal:11434 in the env file). On
    # Linux `host.docker.internal` does not exist unless mapped; `host-gateway` resolves it to
    # the bridge gateway at container start. Inert for an instance that never uses the name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      # V8 heap cap below the container mem_limit so Node GCs before the kernel OOM-kills it.
      # Appends to any NODE_OPTIONS already in the environment instead of clobbering it.
      # (Supersedes the image's baked --max-old-space-size=256; the last flag wins.)
      NODE_OPTIONS: "${NODE_OPTIONS:+${NODE_OPTIONS} }--max-old-space-size=${MCP_MAX_OLD_SPACE_MB:-512}"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-mandrel}
      DATABASE_USER: ${POSTGRES_USER:-mandrel}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set a strong unique value in the instance env file}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # REDIS_URL is required by dotenv-safe (mcp-server/.env.example): absent, the container
      # exits 1 at boot. The two log levels below are ordinary declared config.
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_LOG_LEVEL: ${DB_LOG_LEVEL:-info}
      MCP_HTTP_PORT: 8080
      # Command UI origin for the `/r/<id8>` record permalinks this server emits in tool results.
      # It MUST be THIS instance's own Command UI; set it in the env file (https://<domain>). The
      # empty default is safe: commandUrlConfig.ts then derives the origin from this instance's
      # own MCP_ALLOWED_HOSTS, so the fallback is always self-scoped.
      COMMAND_BASE_URL: "${COMMAND_BASE_URL:-}"
      # Transport auth gate. DEFAULT is ENFORCE (=true): the mcp-server requires a bearer
      # credential (MCP_AUTH_TOKEN, or a Command login JWT). Override in the env file.
      #
      # Every flag declared below follows one rule: `--env-file` is INTERPOLATION ONLY, not
      # container env, so a name this file does not declare is a silent no-op in the instance's
      # env file. Each is declared here so it can be set there; its default mirrors the code
      # default unless the comment says otherwise.
      MCP_BRIDGE_AUTH_ENABLED: "${MCP_BRIDGE_AUTH_ENABLED:-true}"
      # Atomic task-claim kill switch. DEFAULT is ON (=true): the reference loop (mandrel-loop)
      # claims every task it works, and `mandrel-loop doctor` fails when claims are off. Set it
      # to false to restore the legacy last-write-wins task_update.
      # Read by mcp-server/src/config/claimConfig.ts.
      MANDREL_TASK_CLAIM_ENABLED: "${MANDREL_TASK_CLAIM_ENABLED:-true}"
      # Session posture flags. ORTHOGONAL: requireActor gates the incoming X-Actor-ID header
      # and enforces even in legacy mode; resolverMode gates which resolver runs.
      #   resolverMode:  legacy (DEFAULT, resolver never consulted) | shadow | actor
      #   requireActor:  false  (DEFAULT, actorless writes fall to `anonymous`)
      # Both defaults mirror mcp-server/src/config/sessionConfig.ts.
      MANDREL_SESSION_RESOLVER_MODE: "${MANDREL_SESSION_RESOLVER_MODE:-legacy}"
      MANDREL_SESSION_REQUIRE_ACTOR: "${MANDREL_SESSION_REQUIRE_ACTOR:-false}"
      # Edge-provenance alarm: OFF here. The code default is NODE_ENV==production (true in
      # this file), and an instance with no alert delivery configured has nowhere to send it.
      MANDREL_PROVENANCE_ALARM_ENABLED: "${MANDREL_PROVENANCE_ALARM_ENABLED:-false}"
      # Branch-scoped briefing selection, DEFAULT OFF (mirrors briefingConfig.ts
      # BRIEFING_BRANCH_SCOPE_ENABLED).
      MANDREL_BRIEFING_BRANCH_SCOPE_ENABLED: "${MANDREL_BRIEFING_BRANCH_SCOPE_ENABLED:-false}"
      # Briefing render altitude: the kill switch for the two render altitudes, the reserved
      # full-prose slots and the selection quotas (config/briefingAltitudeConfig.ts). DEFAULT
      # TRUE, matching the code default; set false for the plain briefing document.
      MANDREL_BRIEFING_ALTITUDE_ENABLED: "${MANDREL_BRIEFING_ALTITUDE_ENABLED:-true}"
      # Unidentified-caller project scope guard: off | shadow | enforce.
      # A PASSTHROUGH, deliberately not a literal: it renders an EMPTY string, and
      # callerIdentityConfig.ts folds empty/unrecognised into PROJECT_SCOPE_GUARD_DEFAULT,
      # which is `enforce` (proved by mcp-server/src/tests/projectScopeGuardPassthrough.contract.test.ts).
      # An explicit value in the env file wins over this declaration.
      MANDREL_PROJECT_SCOPE_GUARD: "${MANDREL_PROJECT_SCOPE_GUARD:-}"
      # Embedder selection: which embedding model this instance uses, and therefore which
      # `contexts` vector column it reads and writes. The default mirrors the code default,
      # `minilm` (built in, offline), pinned from both ends by
      # scripts/test/compose-code-default-agreement.test.sh. An UNRECOGNIZED value THROWS in
      # both readers rather than falling back.
      #
      # DECLARED ON BOTH SERVICES ON PURPOSE. The two processes pick the vector column
      # INDEPENDENTLY from this one name; if only one of them is handed a value, one writes
      # embedding_gemma while the other queries `embedding` and new rows vanish from the UI's
      # search. Keep the two declarations in lockstep.
      MANDREL_EMBEDDER: "${MANDREL_EMBEDDER:-minilm}"
      # Ollama endpoint for the gemma embedder. The default mirrors
      # mcp-server/src/config/embeddingConfig.ts OLLAMA_ENDPOINT; a containerised instance
      # reaching the host's daemon sets http://host.docker.internal:11434 (mapped by
      # extra_hosts above). mcp-server ONLY: the Command backend never embeds, it only selects
      # the vector COLUMN via MANDREL_EMBEDDER.
      MANDREL_OLLAMA_ENDPOINT: "${MANDREL_OLLAMA_ENDPOINT:-http://127.0.0.1:11434}"
      # OAuth 2.1 authorization server (better-auth). OFF by default; defaults mirror
      # mcp-server/src/config/betterAuthConfig.ts. An EMPTY default is identical to UNSET:
      # betterAuthConfig.ts treats '' as missing, so the code's own defaults (issuer
      # http://localhost:8080, resource <issuer>/mcp, the dev secret) still apply.
      # MANDREL_OAUTH_SECRET is a real credential: passthrough ONLY, never a literal here.
      # BASE_PATH is /api/oauth, NOT better-auth's own /api/auth: /api/auth belongs to the
      # Command UI dashboard backend, and the OAuth router would steal the dashboard login.
      MANDREL_OAUTH_ENABLED: "${MANDREL_OAUTH_ENABLED:-false}"
      MANDREL_OAUTH_ISSUER: "${MANDREL_OAUTH_ISSUER:-}"
      MANDREL_OAUTH_RESOURCE: "${MANDREL_OAUTH_RESOURCE:-}"
      MANDREL_OAUTH_SECRET: "${MANDREL_OAUTH_SECRET:-}"
      MANDREL_OAUTH_BASE_PATH: "${MANDREL_OAUTH_BASE_PATH:-/api/oauth}"
      # More OAuth flags, every default mirroring betterAuthConfig.ts:
      #   MANDREL_OAUTH_ALLOW_SIGNUP     false. Governs OPEN, UNAUTHENTICATED self-registration
      #                                  at `<basePath>/sign-up/email`: on a public domain, true
      #                                  lets anyone who reaches it register.
      #   MANDREL_OAUTH_CORS_ORIGINS     https://claude.ai
      #   MANDREL_OAUTH_TRUSTED_ORIGINS  empty passthrough; the code derives [issuer, ...corsOrigins].
      #   BETTER_AUTH_SECRET             better-auth's native secret name, honoured behind
      #                                  MANDREL_OAUTH_SECRET (which wins). Passthrough only.
      MANDREL_OAUTH_ALLOW_SIGNUP: "${MANDREL_OAUTH_ALLOW_SIGNUP:-false}"
      MANDREL_OAUTH_CORS_ORIGINS: "${MANDREL_OAUTH_CORS_ORIGINS:-https://claude.ai}"
      MANDREL_OAUTH_TRUSTED_ORIGINS: "${MANDREL_OAUTH_TRUSTED_ORIGINS:-}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
      # Dynamic client registration abuse controls for the public `<basePath>/oauth2/register`
      # endpoint (public DCR, RFC 7591, which Claude.ai's connector needs): a register rate
      # limit, a hard client cap, and a TTL sweep of abandoned clients. Defaults mirror
      # mcp-server/src/config/oauthClientConfig.ts.
      MANDREL_OAUTH_RATELIMIT_ENABLED: "${MANDREL_OAUTH_RATELIMIT_ENABLED:-true}"
      MANDREL_OAUTH_DCR_RATE_WINDOW_SEC: "${MANDREL_OAUTH_DCR_RATE_WINDOW_SEC:-60}"
      MANDREL_OAUTH_DCR_RATE_MAX: "${MANDREL_OAUTH_DCR_RATE_MAX:-5}"
      MANDREL_OAUTH_DCR_CLIENT_CAP: "${MANDREL_OAUTH_DCR_CLIENT_CAP:-100}"
      MANDREL_OAUTH_DCR_SWEEP_ENABLED: "${MANDREL_OAUTH_DCR_SWEEP_ENABLED:-true}"
      MANDREL_OAUTH_DCR_TTL_DAYS: "${MANDREL_OAUTH_DCR_TTL_DAYS:-30}"
      MANDREL_OAUTH_DCR_SWEEP_INTERVAL_MINUTES: "${MANDREL_OAUTH_DCR_SWEEP_INTERVAL_MINUTES:-360}"
      # NOT declared here, deliberately: MANDREL_OAUTH_SEED_{EMAIL,PASSWORD,NAME,ROTATE}
      # (seed-first-oauth-user.ts). They are inputs to the one-off seed command, passed with
      # `docker exec -e` so the password is never argv and never persists; declared here they
      # would sit in every container's environment, where `docker inspect` reads them back.
      # Keep the singleton lock on tmpfs so a container restart always starts lock-free
      # (mirrors the image default; see mcp-server/Dockerfile and processLock.ts).
      AIDIS_LOCK_FILE: ${AIDIS_LOCK_FILE:-/dev/shm/aidis.pid}
      # Static bridge bearer credential (value: the env file, never a literal). Empty keeps
      # a plain `docker compose config` rendering without an env file.
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
      # MANDREL_JWT_SECRET is deliberately NOT delivered to the mcp-server: the browser's tool
      # calls ride the authenticated Command backend (/api/mcp/*), which attaches
      # MCP_AUTH_TOKEN itself, so the login-JWT credential path has no caller and stays
      # UNAVAILABLE. The JWT secret is a backend-only secret (command-backend below). Do not
      # add it here: that would give any logged-in user full tool access.
      # Host allow-list: set it in the env file. The empty passthrough keeps dev renders working.
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
      # Tool surface: the 11-tool gateway surface by default; lazy tools/list.
      MANDREL_TOOL_SURFACE: "${MANDREL_TOOL_SURFACE:-gateway}"
      MANDREL_TOOLLIST_MODE: "${MANDREL_TOOLLIST_MODE:-lazy}"
      # Identity-state flags; every default mirrors the code default:
      #   MANDREL_ACTOR_COMPOSITE_ENABLED      false  <- actorIdentityConfig.ts
      #   MANDREL_ANCHOR_STRICT_SESSION_KEYING false  <- reliableThreadingConfig.ts
      #   MANDREL_ACTOR_PROJECT_STATE_ENABLED  false  <- actorProjectStateConfig.ts
      MANDREL_ACTOR_COMPOSITE_ENABLED: "${MANDREL_ACTOR_COMPOSITE_ENABLED:-false}"
      MANDREL_ANCHOR_STRICT_SESSION_KEYING: "${MANDREL_ANCHOR_STRICT_SESSION_KEYING:-false}"
      MANDREL_ACTOR_PROJECT_STATE_ENABLED: "${MANDREL_ACTOR_PROJECT_STATE_ENABLED:-false}"
      # Unattributed-write notice (config/attributionNoticeConfig.ts). A single-user instance
      # sets SUGGESTED_ACTOR to its one correct name, turning the message into copy-paste
      # instructions; a multi-user instance leaves it unset. Defaults mirror the code, and the
      # empty passthroughs read as unset.
      MANDREL_ATTRIBUTION_NOTICE_ENABLED: "${MANDREL_ATTRIBUTION_NOTICE_ENABLED:-true}"
      MANDREL_ATTRIBUTION_SUGGESTED_ACTOR: "${MANDREL_ATTRIBUTION_SUGGESTED_ACTOR:-}"
      MANDREL_ATTRIBUTION_NOTICE_SETUP_URL: "${MANDREL_ATTRIBUTION_NOTICE_SETUP_URL:-}"
      MANDREL_ATTRIBUTION_NOTICE_DEADLINE: "${MANDREL_ATTRIBUTION_NOTICE_DEADLINE:-}"
      MANDREL_ATTRIBUTION_NOTICE_TTL_MS: "${MANDREL_ATTRIBUTION_NOTICE_TTL_MS:-}"
      MANDREL_ATTRIBUTION_NOTICE_MAX_KEYS: "${MANDREL_ATTRIBUTION_NOTICE_MAX_KEYS:-}"
      # Branch model: declared limbs and recall_thread terminality, each behind a kill switch
      # that must be settable (and so persistable) per instance. Every default mirrors the
      # code default:
      #   MANDREL_LIMBS_WRITE_TIME_ENABLED                 true   <- declaredLimbsConfig.ts
      #   MANDREL_LIMBS_BACKFILL_BATCH                     500    <- declaredLimbsConfig.ts
      #   MANDREL_THREAD_TERMINALITY                       off    <- threadTerminalityConfig.ts
      #   MANDREL_THREAD_TERMINALITY_TRANSIT_THETA         0.01   <- threadTerminalityConfig.ts
      #   MANDREL_THREAD_TERMINALITY_UNASSIGNABLE_TERMINAL true   <- threadTerminalityConfig.ts
      #   MANDREL_THREAD_TERMINALITY_NOT_DERIVED_TERMINAL  false  <- threadTerminalityConfig.ts
      # scripts/test/compose-code-default-agreement.test.sh holds each pairing against the source.
      # Read the mode back: `mandrel_status` reports featureFlags.threadTerminality (and
      # .threadTerminalitySource: "off because unset" vs "off because your value was rejected").
      MANDREL_LIMBS_WRITE_TIME_ENABLED: "${MANDREL_LIMBS_WRITE_TIME_ENABLED:-true}"
      MANDREL_LIMBS_BACKFILL_BATCH: "${MANDREL_LIMBS_BACKFILL_BATCH:-500}"
      MANDREL_THREAD_TERMINALITY: "${MANDREL_THREAD_TERMINALITY:-off}"
      MANDREL_THREAD_TERMINALITY_TRANSIT_THETA: "${MANDREL_THREAD_TERMINALITY_TRANSIT_THETA:-0.01}"
      MANDREL_THREAD_TERMINALITY_UNASSIGNABLE_TERMINAL: "${MANDREL_THREAD_TERMINALITY_UNASSIGNABLE_TERMINAL:-true}"
      MANDREL_THREAD_TERMINALITY_NOT_DERIVED_TERMINAL: "${MANDREL_THREAD_TERMINALITY_NOT_DERIVED_TERMINAL:-false}"
      # Belief adjudication (supersession). NO DEFAULT HERE: unset renders '' and envBool folds
      # '' into the code default, off unless an adjudicator credential is present
      # (BELIEF_ENABLED_NO_CREDENTIAL_DEFAULT), so a self-hoster who sets a key gets
      # supersession without a second switch. A pinned `false` here would defeat that.
      MANDREL_BELIEF_ENABLED: "${MANDREL_BELIEF_ENABLED:-}"
      # Passthrough: empty folds into the code default.
      MANDREL_BELIEF_ADJUDICATOR_PROVIDER: "${MANDREL_BELIEF_ADJUDICATOR_PROVIDER:-}"
      # The adjudicator credentials. The container-side names are the ones the code reads
      # (beliefConfig.ts BELIEF_TIERED_CONFIG). SUBQ_API_KEY / ANTHROPIC_API_KEY come from the
      # same names in .env, as docs/manual/supersession.md describes. Compose resolves ${X}
      # from the SHELL before --env-file (see the header), so run compose from a shell that
      # does not export another instance's key. Values live ONLY in the env file.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      SUBQ_API_KEY: "${SUBQ_API_KEY:-}"
      GROQ_API_KEY: "${MANDREL_BELIEF_GROQ_API_KEY:-}"
      # Tier-1 provider and the daily paid-adjudication cap. Passthroughs: empty folds into the
      # code default (subq / $2).
      MANDREL_BELIEF_TIER1_PROVIDER: "${MANDREL_BELIEF_TIER1_PROVIDER:-}"
      MANDREL_BELIEF_DAILY_SPEND_CAP_USD: "${MANDREL_BELIEF_DAILY_SPEND_CAP_USD:-}"
      # Boot-time embedder check (embeddingConfig.ts): empty -> the strict code default
      # (refuse to start when the embedder cannot load / be reached); `warn` starts anyway.
      MANDREL_EMBEDDING_VERIFY_STARTUP: "${MANDREL_EMBEDDING_VERIFY_STARTUP:-}"
      # Lane of an untagged handoff (handoffLaneConfig.ts): empty -> the code default.
      MANDREL_HANDOFF_DEFAULT_LANE: "${MANDREL_HANDOFF_DEFAULT_LANE:-}"
      # Extra supersession pair-exclusion content prefixes (beliefConfig.ts): empty adds none.
      MANDREL_BELIEF_PAIR_EXCLUDE_CONTENT_PREFIXES_EXTRA: "${MANDREL_BELIEF_PAIR_EXCLUDE_CONTENT_PREFIXES_EXTRA:-}"
    # --- Traefik routing (labels only, plain HTTP behind a TLS-terminating proxy) ---
    # Exact /mcp and PathPrefix /healthz on ${TENANT_DOMAIN} -> this mcp-server:8080, at a
    # higher priority than the frontend catch-all so path matches win. Inert unless Traefik
    # runs against this stack.
    #
    # /mcp is Path(), NOT PathPrefix(): the streamable MCP transport is a single endpoint
    # (GET/POST/DELETE on exactly /mcp), while the /mcp/tools/* bridge subpaths are a
    # tool-execution surface no public caller may reach. With Path(), /mcp/tools/* matches
    # NO router and falls to the frontend catch-all, which serves the SPA shell.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mandrel-${TENANT_HANDLE:-dev}_mandrel-network"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-mcp.rule=Host(`${TENANT_DOMAIN:-localhost}`) && Path(`/mcp`)"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-mcp.entrypoints=web"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-mcp.priority=100"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-mcp.service=${TENANT_HANDLE:-dev}-mcp-svc"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-healthz.rule=Host(`${TENANT_DOMAIN:-localhost}`) && PathPrefix(`/healthz`)"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-healthz.entrypoints=web"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-healthz.priority=100"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-healthz.service=${TENANT_HANDLE:-dev}-mcp-svc"
      - "traefik.http.services.${TENANT_HANDLE:-dev}-mcp-svc.loadbalancer.server.port=8080"
      # --- OAuth router: discovery + better-auth API + sign-in/consent -> mcp-server ---
      # CONDITIONAL BY VALUE: an OAuth-OFF instance must not have /sign-in, /consent and
      # /.well-known/oauth* pulled off the frontend catch-all. Set TENANT_OAUTH_ROUTER_HOST to
      # the instance's domain ONLY when OAuth is enabled; unset, the rule matches an
      # unmatchable .invalid host (RFC 2606) and the router is INERT. /api/oauth, never
      # /api/auth: the dashboard owns /api/auth.
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-oauth.rule=Host(`${TENANT_OAUTH_ROUTER_HOST:-oauth-router-disabled.invalid}`) && (PathPrefix(`/.well-known/oauth`) || PathPrefix(`/.well-known/openid`) || PathPrefix(`/api/oauth`) || PathPrefix(`/sign-in`) || PathPrefix(`/consent`))"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-oauth.entrypoints=web"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-oauth.priority=100"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-oauth.service=${TENANT_HANDLE:-dev}-mcp-svc"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mandrel-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
    volumes:
      - mcp_data:/app/data
      - mcp_logs:/app/logs

  # Mandrel Command Backend - REST API server
  # Builds from its local Dockerfile (see the mcp-server note).
  mandrel-command-backend:
    build:
      context: ./mandrel-command
      dockerfile: backend/Dockerfile
    image: "mandrel/command-backend:${MANDREL_IMAGE_TAG:-local}"
    container_name: "mandrel-${TENANT_HANDLE:+${TENANT_HANDLE}-}command-backend"
    # Memory cap; override per instance in the env file.
    mem_limit: ${COMMAND_BACKEND_MEM_LIMIT:-384m}
    restart: unless-stopped
    logging: *logging-svc
    ports:
      - "127.0.0.1:${TENANT_BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      LOG_DIR: /app/logs
      # Proxy hops in front of this backend (here: a host proxy -> Traefik -> the frontend
      # container's nginx). Express 'trust proxy' honours the integer, so req.ip (and every
      # per-IP rate limit) is the real client instead of one shared proxy bucket. Set it to
      # match your own proxy chain.
      TRUST_PROXY: "${TRUST_PROXY:-3}"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-mandrel}
      DATABASE_USER: ${POSTGRES_USER:-mandrel}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set a strong unique value in the instance env file}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      MCP_SERVER_URL: http://mcp-server:8080
      MANDREL_MCP_URL: http://mcp-server:8080
      # The backend proxies tool calls to the mcp-server bridge, which REQUIRES this bearer
      # credential (MCP_BRIDGE_AUTH_ENABLED default true); without it every bridge-backed page
      # 401s. The same token the mcp-server uses; empty so `docker compose config` renders.
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Some keys here are required to EXIST by the backend's dotenv-safe validation
      # (mandrel-command/backend/.env.example): a missing one is process.exit(1) in production.
      # The authoritative list is the uncommented lines of that .env.example.
      # INBOUND machine credential for POST /api/git/push-stats. Declared even though it is
      # optional, because dotenv-safe treats every documented key as required to exist. Empty
      # is SAFE: the agent path is CLOSED and the route falls back to user-JWT auth.
      MANDREL_AGENT_TOKEN: "${MANDREL_AGENT_TOKEN:-}"
      MANDREL_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 24h
      BCRYPT_ROUNDS: "12"
      MANDREL_HTTP_PORT: 5000
      MANDREL_MCP_PORT: 8080
      # Per-instance value from the env file; the default keeps the local dev origins.
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:13000,http://localhost:3000}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # `warn`, mirroring the code default (mandrel-command/backend/src/config/logger.ts and
      # environment.ts), checked by scripts/test/compose-code-default-agreement.test.sh. A
      # query log is a place values end up that should not have been there.
      DB_LOG_LEVEL: ${DB_LOG_LEVEL:-warn}
      # Embedder selection: MUST stay in lockstep with the mcp-server declaration above. This
      # backend picks the `contexts` vector column from the SAME env name via its own copy of
      # the key->column map (embeddingColumn.ts). Code default mirrored:
      #   mandrel-command/backend/src/config/embeddingColumn.ts -> 'minilm'
      # An unrecognized value throws instead of silently selecting the wrong column.
      MANDREL_EMBEDDER: "${MANDREL_EMBEDDER:-minilm}"
      ENABLE_LOG_ROTATION: "true"
      LOG_MAX_FILE_SIZE: 20m
      LOG_MAX_FILES: 14d
      FEATURE_FLAG_PHASE1_FEATURE_FLAGS: "false"
      FEATURE_FLAG_PHASE1_CONTRACT_TESTS: "false"
      FEATURE_FLAG_PHASE1_REACT_ERROR_BOUNDARIES: "false"
      # Per-instance value from the env file.
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:13000}"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    networks:
      - mandrel-network
    healthcheck:
      <<: *healthcheck-defaults
      # Backend mounts routes under /api, so health lives at /api/health (not /health).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
    volumes:
      - command_logs:/app/logs
      - command_uploads:/app/uploads

  # Mandrel Command Frontend - React UI served via nginx
  # Builds from its local Dockerfile (see the mcp-server note).
  mandrel-command-frontend:
    build:
      context: ./mandrel-command
      dockerfile: frontend/Dockerfile
    image: "mandrel/command-frontend:${MANDREL_IMAGE_TAG:-local}"
    container_name: "mandrel-${TENANT_HANDLE:+${TENANT_HANDLE}-}command-frontend"
    # Memory cap; override per instance in the env file.
    mem_limit: ${COMMAND_FRONTEND_MEM_LIMIT:-64m}
    restart: unless-stopped
    logging: *logging-svc
    ports:
      - "127.0.0.1:${TENANT_FRONTEND_PORT:-3000}:3000"
    environment:
      REACT_APP_API_URL: /api
    # --- Traefik routing (labels only) ---
    # Catch-all for ${TENANT_DOMAIN} -> the Command UI frontend:3000. priority=1 (lowest), so
    # the /mcp + /healthz path routers above always win. Inert unless Traefik runs.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mandrel-${TENANT_HANDLE:-dev}_mandrel-network"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-frontend.rule=Host(`${TENANT_DOMAIN:-localhost}`)"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-frontend.entrypoints=web"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-frontend.priority=1"
      - "traefik.http.routers.${TENANT_HANDLE:-dev}-frontend.service=${TENANT_HANDLE:-dev}-frontend-svc"
      - "traefik.http.services.${TENANT_HANDLE:-dev}-frontend-svc.loadbalancer.server.port=3000"
    depends_on:
      mandrel-command-backend:
        condition: service_healthy
    networks:
      - mandrel-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mcp_data:
    driver: local
  mcp_logs:
    driver: local
  command_logs:
    driver: local
  command_uploads:
    driver: local

networks:
  mandrel-network:
    driver: bridge